[project]
name = "pytest-deadfixtures"
description = "A simple plugin to list unused fixtures in pytest"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "João Luiz Lorencetti", email = "me@dirtycoder.net" }]
maintainers = [
  { name = "João Luiz Lorencetti", email = "me@dirtycoder.net" },
  { name = "Christian Hartung", email = "6785871+hartungstenio@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Operating System :: OS Independent",
]
dependencies = ["pytest>=7.0.0"]
dynamic = ["version"]

[project.entry-points.pytest11]
deadfixtures = "pytest_deadfixtures"

[project.urls]
Issues = "https://github.com/jllorencetti/pytest-deadfixtures/issues"
Source = "https://github.com/jllorencetti/pytest-deadfixtures"

[dependency-groups]
dev = ["pre-commit", "pytest", "pytest-cov"]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
python = "3.13"
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["dev"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = "coverage xml"

[tool.hatch.envs.hatch-static-analysis]
config-path = "none"
dependencies = ["ruff (>=0.14.12)"]

[tool.hatch.envs.hatch-static-analysis.scripts]
format = "ruff format ."

[tool.coverage.run]
source_pkgs = ["src", "tests"]
branch = true
parallel = true

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
